aid: botrista
name: Botrista
description: 'Botrista, Inc. is a San Francisco based beverage-automation company founded
  in 2017 that builds the DrinkBot robotic beverage dispenser and the CloudBar cloud
  platform behind it. The DrinkBot automates craft beverages — infused teas, flavored
  lemonades, iced coffees and mocktails — dispensing a drink in roughly twenty seconds
  from a touchscreen order, and every unit is internet connected so it pulls recipes,
  reports consumption, tracks ingredient levels and pushes maintenance alerts back to
  Botrista. CloudBar is the operator-facing web application used by restaurant, campus
  dining, convenience and theme-park operators to manage recipes, inventory replenishment
  and sales/menu performance analytics across a fleet of machines, alongside a separate
  Botrista Data Portal. Botrista sells beverage automation as a service rather than as
  a developer platform: as of this profiling pass it publishes no public developer portal,
  no API reference and no machine-readable API contract, and POS integrations are handled
  case-by-case through its commercial team.'
