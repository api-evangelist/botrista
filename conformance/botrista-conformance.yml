summary: 'Botrista runs a hardware-and-service business, not an API platform. Contract
  discovery found no OpenAPI/Swagger, no GraphQL, no AsyncAPI and no gRPC on any host,
  and no developer portal or API reference anywhere on the public site. The two live
  application backends it does run — us-orderbws.botrista.io (CloudBar) and
  portal-api.botrista.com (Botrista Data Portal) — are private first-party backends
  for Botrista''s own single-page applications; neither publishes a spec or a
  discovery document. The one standard Botrista genuinely conforms to on a public,
  anonymous surface is MCP over JSON-RPC 2.0, and only because its Wix-hosted content
  site ships the Wix platform site-MCP endpoint.'
