scope: |
  This is a PLATFORM-PROVIDED MCP server, not a Botrista-authored API. Botrista's
  content site www.botrista.info is built on Wix, and Wix serves a site MCP endpoint
  at /_api/mcp on every such site. It is genuinely served from a Botrista-controlled
  host and is anonymously callable, so it is a real agent surface for the company —
  but the tools it exposes read the WEBSITE (business details, site search, blog and
  store data) and drive the Wix REST API. It exposes no DrinkBot, CloudBar or
  Botrista Data Portal capability. Botrista publishes no product MCP server.
