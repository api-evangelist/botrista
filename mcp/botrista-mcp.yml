tools:
- name: GetBusinessDetails
  description: Get business and site details (timezone, email, phone, address) for the
    Botrista, Inc. site.
- name: SearchInSite
  description: Search the Botrista, Inc. site for information.
- name: SearchSiteApiDocs
  description: Search the installed Wix business-solution API documentation for the site
    and explain how to call it.
- name: GenerateVisitorToken
  description: Create a visitor session and obtain a visitor access token for the site.
- name: CallWixSiteAPI
  description: Call Wix API methods on the site to act on behalf of a visitor (query
    site data, start a purchase).
- name: ExecuteWixAPI
  description: Run JavaScript against the Wix REST API on the site.
- name: BrowseWixRESTDocsMenu
  description: Browse the Wix REST API documentation menu hierarchy.
- name: ReadFullDocsArticle
  description: Fetch a full article from the Wix developer documentation portal.
- name: ReadFullDocsMethodSchema
  description: Fetch the full schema for a Wix API method.
site_capabilities:
- Blog App — list and query blog posts
- Ecommerce App — manage cart, open checkout for a cart
- Stores App — list and query store products, view a product, add to cart, open checkout
